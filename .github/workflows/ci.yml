name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test
      - name: Bundle the app (compiles the icon and signs ad hoc)
        run: scripts/bundle.sh release
      - name: Pack the drag-to-install DMG
        run: scripts/dmg.sh build/Ampersand.app build/Ampersand-ci.dmg
